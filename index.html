<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>热点编辑台 · 游戏营销 Demo</title>
<style>
:root{color-scheme:dark;--bg:#11141b;--panel:#1a202a;--line:#313a48;--muted:#a8b4c5;--ink:#f0f3f8;--mint:#abf3cd;--warn:#f3cd89}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft YaHei UI",system-ui,sans-serif}header,main{max-width:1220px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}h1,h2,h3,p{margin:0 0 10px}h1{font-size:clamp(29px,5vw,47px);letter-spacing:-.04em}h2{font-size:20px}h3{font-size:17px}small,.muted{color:var(--muted)}small{font-size:13px}.brand{font-weight:750}.brand b{color:var(--mint);margin-right:9px}.hero{background:radial-gradient(ellipse at top right,#274c44,transparent 67%),#1a232e;border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:20px}.hero p{color:#c8d4df}.pill{display:inline-block;border:1px solid #48685e;border-radius:100px;color:var(--mint);padding:2px 10px;font-size:13px;white-space:nowrap}.warn{color:var(--warn);border-color:#69583c}.bad{color:#ffada9;border-color:#754747}.steps,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.steps{margin-top:18px;color:var(--muted);font-size:14px;gap:18px}.steps b{color:var(--mint);margin-right:5px}.layout{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}.panel{border-radius:15px;border:1px solid var(--line);padding:18px;background:var(--panel)}.list{display:grid;gap:8px;margin-top:14px}.item{text-align:left;display:grid;gap:6px;width:100%;padding:12px;background:#151a22}.item[aria-pressed=true]{border-color:var(--mint);background:#243732}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.box{border:1px solid var(--line);border-radius:10px;padding:12px;background:#151a22}.section{border-top:1px solid var(--line);padding-top:15px;margin-top:16px}button,select,input,textarea{font:inherit;color:inherit;border:1px solid #495466;border-radius:8px;background:#242d3b;padding:7px 11px}button{cursor:pointer;font-size:14px;font-weight:650}button:hover:not(:disabled){border-color:var(--mint)}button:disabled{opacity:.46;cursor:default}.primary{background:var(--mint);color:#101e19;border-color:var(--mint)}textarea,input{width:100%;background:#151a22}textarea{min-height:215px;resize:vertical}label{display:block;margin:9px 0 4px}a{color:var(--mint)}details{margin-top:13px}summary{cursor:pointer}ul{padding-left:22px;margin:8px 0}#notice{min-height:26px;color:var(--mint);margin:0 0 8px}.tabs{margin:10px 0}.tabs button[aria-pressed=true]{border-color:var(--mint);color:var(--mint)}.script-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}@media(max-width:760px){.layout,.summary{grid-template-columns:1fr}header,main{padding:14px}.hero{padding:18px}}
</style></head><body>
<header><div class="brand"><b>✦</b>游戏营销工作台</div><span class="pill">本地 Demo</span></header>
<main><section class="hero"><h1>热点编辑台</h1><p>为《王者荣耀》筛选热点，制作 30–60 秒抖音竖屏脚本。</p><div class="actions"><button class="primary" id="live" hidden>立即采样</button><button id="import-real">导入已查证样本</button><button id="collect">采集模拟热点</button></div><small id="sources" role="status"></small><div class="steps"><span><b>01</b>采集</span><span><b>02</b>核验</span><span><b>03</b>匹配与选题</span><span><b>04</b>生成</span><span><b>05</b>终审</span></div></section>
<p id="notice" role="status"></p><div class="layout"><aside class="panel"><h2>热点队列</h2><label for="filter">核验状态</label><select id="filter"><option>全部</option><option>可信</option><option>存疑</option><option>不实</option></select><div class="list" id="list"></div><details><summary>游戏设定</summary><p>《王者荣耀》以 5v5 王者峡谷团队竞技为核心。本次面向开黑玩家与对局复盘爱好者，围绕团队配合、局内沟通和团战回放创作。营销避开玩家攻击和未经证实的活动承诺。</p></details></aside><article class="panel" id="detail"></article></div>
</main><script>
'use strict';
const samples=[
 {id:'cloud',title:'朋友间的无声默契挑战引发二创',heat:97,minutes:22,topic:'开黑默契',evidence:[['创作者原片','原片展示朋友在无台词条件下完成协作挑战。'],['短视频社区专题','独立记录同一作品的发布时间和二创趋势。']],reason:'样例中的两条独立证据指向同一作品和发布时间。',score:94,match:'可用王者峡谷 5v5 对局展示队友如何通过集合信号、站位和进场时机打出配合。'},
 {id:'bell',title:'只听声音猜游戏挑战升温',heat:84,minutes:41,topic:'声音猜游戏',evidence:[['UP 主视频','原片用音效片段考验观众能否猜出游戏。']],reason:'样例目前只有单一投稿，待运营补充独立来源。',score:87,match:'可用自录的王者峡谷对局音效设计互动竞猜，并用对应画面揭晓。'},
 {id:'gift',title:'传某联动将赠送全服道具',heat:76,minutes:68,topic:'道具',evidence:[['二传短视频','内容转述未署名截图。'],['活动方公告','公告明确否认该赠送活动。']],reason:'样例中活动方对活动承诺有明确否认。',score:0,match:''},
 {id:'sale',title:'购物折扣口诀在评论区流行',heat:62,minutes:90,topic:'购物口诀',evidence:[['原始投稿','视频记录折扣口诀。'],['社区独立观察','同一关键词下出现独立模仿。']],reason:'样例中有原始内容和独立观察。',score:34,match:'促销梗和5v5 团队竞技的关联较弱，容易让玩家误解为充值活动。'}
];
const KEY='honor-of-kings-editor-v1';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records=[];
try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}
let selected=records[0]?.id, version=0;
function save(message){
 try{localStorage.setItem(KEY,JSON.stringify(records))}catch{message+='。浏览器存储不可用，刷新会清空进度'}
 $('notice').textContent=message;
 render();
}
const statusClass=s=>s==='可信'?'':s==='存疑'?' warn':' bad';
function liveEvidence(r){
 const item=r.live;
 return '<p><a href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer">打开 B 站原片</a></p>'+
 '<details><summary>采样记录</summary><ul>'+item.observations.map(o=>'<li>'+esc(o.source)+' · '+esc(stamp(o.sampled))+
 (o.views==null?'':' · 播放 '+o.views.toLocaleString('zh-CN'))+(o.rank==null?'':' · 第 '+o.rank+' 位')+'</li>').join('')+'</ul></details>';
}
function render(){
 const visible=records.filter(r=>$('filter').value==='全部'||r.trust===$('filter').value);
 if(!visible.some(r=>r.id===selected)){selected=visible[0]?.id;version=0}
 $('list').innerHTML=visible.map(r=>'<button class="item" data-id="'+r.id+'" aria-pressed="'+(r.id===selected)+'"><strong>'+esc(r.title)+'</strong><small>'+(r.live?esc(r.live.source):r.real?'播放快照约 79.3 万':'热度 '+r.heat)+' · '+r.trust+(r.real?' · 真实样本':' · 模拟')+'</small></button>').join('')||'<p class="muted">当前没有热点</p>';
 const r=visible.find(r=>r.id===selected);
 if(!r){$('detail').innerHTML='<h2>开始选题</h2><p class="muted">采集演示热点后，即可查看证据、确认选题并生成脚本。</p>';return}
 const eligible=r.trust==='可信'&&r.score>=70;
 const evidence=r.evidence.map(([name,body])=>'<li><strong>'+esc(name)+'</strong> · '+esc(body)+'</li>').join('');
 const v=r.scripts[version];
 $('detail').innerHTML=
 '<div class="script-head"><span class="pill'+statusClass(r.trust)+'">'+r.trust+'</span><small>'+(r.live?esc(r.live.source)+(r.live.views==null?'':' · 播放 '+r.live.views.toLocaleString('zh-CN')):r.real?'B 站官方回放 · 播放快照约 79.3 万':'模拟来源 · 热度 '+r.heat)+'</small></div>'+
 '<h2>'+esc(r.title)+'</h2><small>发布时间 '+esc(r.published)+' · 采集时间 '+esc(r.ingested)+'</small>'+
 '<div class="summary"><section class="box"><h3>核验证据</h3><p>'+esc(r.reason)+'</p><ul>'+evidence+'</ul>'+(r.live?liveEvidence(r):r.real?'<a href="https://www.bilibili.com/video/BV1HvWJ6WE8B?p=1" target="_blank" rel="noopener noreferrer">打开 B 站赛事原片</a>':'')+'</section>'+
 '<section class="box"><h3>游戏匹配</h3>'+(r.trust==='可信'?'<p><strong>'+r.score+' / 100</strong> · 门槛 70</p><p>'+esc(r.match)+'</p>':'<p class="muted">等待可信结论，暂不进入匹配。</p>')+'</section></div>'+
 (r.review?'<p>复核记录 · '+esc(r.review)+'</p>':'')+
 (r.trust==='存疑'?'<label for="review">补充证据与复核理由</label><input id="review" placeholder="填写核对的来源和结果">'+(r.live?'<label for="score">适配分（0–100）</label><input id="score" type="number" min="0" max="100"><label for="match">适配理由</label><input id="match">':'')+'<div class="actions section"><button data-action="credible">复核为可信</button><button data-action="false">复核为不实</button></div>':'')+
 '<div class="actions section"><button data-action="confirm" '+(!eligible||r.confirmed?'disabled':'')+'>'+(r.confirmed?'选题已确认':'确认选题')+'</button><button class="primary" data-action="generate" '+(!r.confirmed||r.scripts.length?'disabled':'')+'>生成两版脚本</button></div>'+
 (v?'<section class="section"><div class="script-head"><h3>脚本终审</h3><span class="pill">'+esc(v.status)+'</span><small>修订 '+(v.history.length+1)+'</small></div><div class="tabs">'+r.scripts.map((s,i)=>'<button data-version="'+i+'" aria-pressed="'+(i===version)+'">'+esc(s.name)+'</button>').join('')+'</div>'+
 '<label for="duration">预计时长（秒）</label><input id="duration" type="number" min="1" step="1" value="'+v.seconds+'" '+(v.status==='通过'?'readonly':'')+'><label for="script">竖屏分镜、口播和话题标签</label><textarea id="script" '+(v.status==='通过'?'readonly':'')+'>'+esc(v.body)+'</textarea>'+
 '<p id="checks" class="muted"></p>'+(v.rejection?'<p>最近驳回原因 · '+esc(v.rejection)+'</p>':'')+
 (v.status==='通过'?'<button class="primary" data-action="export">导出已审脚本</button>':'<label for="reject">驳回理由</label><input id="reject" placeholder="驳回时必填"><div class="actions section"><button data-action="save">保存修改</button><button data-action="reject">驳回</button><button class="primary" data-action="approve">确认终稿</button></div>')+'</section>':'');
 if(v)checkDraft();
}
function draftErrors(seconds,body){
 const errors=[];
 if(!Number.isInteger(seconds)||seconds<30||seconds>60)errors.push('时长需为 30–60 秒');
 if(!['开场','实录','结尾'].every(label=>body.includes(label))||!/#\S+/.test(body))errors.push('需有开场、实录、结尾与话题标签');
 if(/赌博|包赢|全服免费|伤亡/.test(body))errors.push('命中演示限制词');
 return errors;
}
function checkDraft(){
 const errors=draftErrors(Number($('duration').value),$('script').value);
 $('checks').textContent=errors.length?'规则检查 · '+errors.join(' / '):'规则检查通过 · 请人工核对游戏设定和素材';
 return errors;
}
function variants(r){
 if(r.live)return ['热点切入','实录复盘'].map((name,i)=>({
  name,seconds:i?36:42,history:[],status:'待审',
  body:(i?'00–05 秒｜开场：今天用一段自录对局，看这条热点能给排位什么启发。':'00–05 秒｜开场：最近有条视频引发讨论，你怎么看？')+'\n05–27 秒｜实录：片头标出来源标题「'+r.title+'」，依据复核要点「'+r.review+'」写口播；切入自录王者峡谷画面，展示「'+r.match+'」对应的情境。\n27–'+(i?36:42)+' 秒｜结尾：请观众分享自己的处理方式。\n#王者荣耀 #王者峡谷'
 }));
 if(r.real)return ['赛后讨论','开团教学'].map((name,i)=>({
  name,seconds:40,history:[],status:'待审',
  body:(i===0?'00–05 秒｜开场：看完北京WB 对 广州TTG，你最想复盘哪个瞬间？':'00–05 秒｜开场：聊完 KPL，回到自己的排位：队友还没到，要先开团吗？')+'\n05–31 秒｜实录：用自录王者峡谷对局演示集合信号、队友靠拢和跟进输出，标注自录演示。\n31–40 秒｜结尾：请观众分享自己判断开团时机的方法。\n#王者荣耀 #KPL #团战复盘'
 }));
 const teamwork=r.id==='cloud';
 return [
  {name:'A · 互动钩子',seconds:42,body:teamwork?'00–05 秒｜开场：团战画面定格。口播「不开麦，队友能看懂你想干嘛吗？」\n05–32 秒｜实录：先放集合信号，再切到小地图里的队友走位，最后慢放前排进场与队友跟进。口播「看到队友靠过来，才是这波能接的信号。」\n32–42 秒｜结尾：回放关键一秒。口播「把这条发给那个不用开麦也懂你的队友。」\n#王者荣耀 #开黑默契':'00–05 秒｜开场：黑屏播放一段对局音效。口播「闭眼听，你猜这是峡谷里的哪个瞬间？」\n05–32 秒｜实录：依次播放技能施放、回城和推塔的自录声音，留出猜题时间，再用对应对局画面揭晓。\n32–42 秒｜结尾：字幕公布三题答案。口播「你猜对了几题？」\n#王者荣耀 #峡谷听力挑战'},
  {name:'B · 实录剪辑',seconds:36,body:teamwork?'00–04 秒｜开场：先放团战结果，字幕「这波配合，开打前就能看出来」。\n04–27 秒｜实录：回到开团前，从同一段对局中标出集合信号、队友靠拢和跟进输出三个瞬间。\n27–36 秒｜结尾：并排回放进场与跟进画面，字幕「你最信任哪位开黑队友？」\n#王者荣耀 #峡谷团战复盘':'00–04 秒｜开场：字幕「只听声音，你能认出这场团战吗？」\n04–27 秒｜实录：先播放原声，再按声音出现顺序切回对局，展示技能命中和队友跟进的对应画面。\n27–36 秒｜结尾：保留最后一段音效，邀请观众在评论区猜对应画面。\n#王者荣耀 #听声猜团战'}
 ].map(v=>({...v,status:'待审',history:[]}));
}
$('import-real').addEventListener('click',()=>{
 const id='kpl-2026-11-08';
 if(!records.some(r=>r.id===id))records.unshift({
  id,real:true,title:'2026 KPL 年度总决赛｜北京WB 对 广州TTG',heat:793000,
  published:'2026-11-08 18:49:15',ingested:'2026-11-20（网页查证）',trust:'存疑',
  evidence:[['B 站赛事官方账号','原片显示对阵双方及发布时间。']],
  reason:'赛事原片可追溯。请核对脚本拟引用的事实和片段，播放量来自页面快照。',
  score:96,match:'赛事适合切入团战沟通与跟进，用自录对局演示。',
  confirmed:false,scripts:[]
 });
 $('filter').value='全部';selected=id;version=0;save('已载入赛事快照，请查看原片并复核');
});
$('collect').addEventListener('click',()=>{
 const time=new Date();
 const stamp=d=>d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
 let count=0;
 for(const s of samples){
  if(records.some(r=>r.id===s.id))continue;
  records.push({...s,published:stamp(new Date(time-s.minutes*60000)),ingested:stamp(time),trust:s.id==='bell'?'存疑':s.id==='gift'?'不实':'可信',confirmed:false,scripts:[]});
  count++;
 }
 $('filter').value='全部';
 save(count?'已采集 '+count+' 条模拟热点':'热点已去重，审核进度已保留');
});
$('filter').addEventListener('change',render);
$('list').addEventListener('click',e=>{const button=e.target.closest('[data-id]');if(button){selected=button.dataset.id;version=0;render()}});
$('detail').addEventListener('input',e=>{if(['duration','script'].includes(e.target.id))checkDraft()});
$('detail').addEventListener('click',e=>{
 const button=e.target.closest('button');
 if(!button)return;
 const r=records.find(row=>row.id===selected);
 if(button.dataset.version!==undefined){version=Number(button.dataset.version);render();return}
 const action=button.dataset.action;
 if(action==='credible'||action==='false'){
  const reason=$('review').value.trim();
  if(!reason){$('notice').textContent='请填写复核理由';return}
  if(r.live&&action==='credible'){
   const score=$('score').value, reason=$('match').value.trim();
   if(!score||!Number.isInteger(Number(score))||Number(score)<0||Number(score)>100||!reason){$('notice').textContent='请填写 0–100 的适配分和适配理由';return}
   r.score=Number(score);r.match=reason;
  }
  r.trust=action==='credible'?'可信':'不实';r.review=reason;save('已记录人工复核');return;
 }
 if(action==='confirm'){r.confirmed=true;save('已确认选题');return}
 if(action==='generate'){r.scripts=variants(r);version=0;save('已生成两版模板草稿，请审阅');return}
 const v=r.scripts[version];
 if(action==='export'){
  const url=URL.createObjectURL(new Blob(['《王者荣耀》｜'+r.title+'\n'+v.name+'｜'+v.seconds+' 秒\n\n'+v.body],{type:'text/plain;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='王者荣耀-已审脚本.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
 }
 if(action==='approve'&&checkDraft().length){$('notice').textContent='解决规则检查项后即可确认终稿';return}
 const rejection=$('reject').value.trim();
 if(action==='reject'&&!rejection){$('notice').textContent='请填写驳回理由';return}
 const seconds=Number($('duration').value),body=$('script').value.trim();
 if(seconds!==v.seconds||body!==v.body){v.history.push({seconds:v.seconds,body:v.body});v.seconds=seconds;v.body=body}
 if(action==='reject')v.rejection=rejection;
 v.status={save:'修改中',reject:'驳回',approve:'通过'}[action];
 save('脚本状态已更新为'+v.status);
});
const localService=location.protocol==='http:' && ['127.0.0.1','localhost'].includes(location.hostname);
const stamp=value=>value?new Date(value).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'未提供';
async function syncLive(trigger=false){
 const button=$('live');
 button.disabled=true;
 try{
  if(trigger&&localService)await fetchData('/api/collect',{method:'POST'});
  const {items,run,interval}=await fetchData(localService?'/api/hotspots':'./hotspots.json');
  let added=0;
  for(const item of items){
   const id='live-'+item.id;
   let record=records.find(row=>row.id===id);
   if(!record){
    record={id,real:true,trust:'存疑',reason:'运营需打开原片，核对拟引用的事实和内容。',score:0,
     match:'当前还没有适配评分。复核时请评估是否适合王者荣耀营销。',confirmed:false,scripts:[]};
    records.push(record);added++;
   }
   Object.assign(record,{live:item,title:item.title,published:stamp(item.published),ingested:stamp(item.first_seen),
    evidence:[[item.publisher,item.source+' · 最近采样 '+stamp(item.last_seen)]]});
  }
  if(trigger&&added){$('filter').value='全部';selected=records.find(row=>row.live)?.id;version=0}
  const counts=run?Object.entries(run.counts).map(([name,n])=>name+' '+n+' 条').join(' · '):'等待首次采样';
  const errors=run?Object.entries(run.errors).map(([name,error])=>name+'：'+error).join(' · '):'';
  $('sources').textContent=[counts,errors,'间隔 '+(interval/60)+' 分钟'].filter(Boolean).join('；');
  if(trigger||(added&&!records.find(r=>r.id===selected)?.scripts.length))save(added?'同步了 '+added+' 条新记录':'同步完成，采样详情见上方');
  else if(!document.activeElement?.matches('input,textarea')&&!records.find(r=>r.id===selected)?.scripts.length)render();
 }catch(error){$('sources').textContent='读取采样服务失败：'+error.message}
 finally{button.disabled=false}
}
async function fetchData(url,options){
 const response=await fetch(url,options);
 if(!response.ok)throw Error('HTTP '+response.status);
 const json=await response.json();
 if(json.busy)throw Error('采样正在进行，稍后自动刷新');
 return json;
}
if(location.protocol!=='file:'){
 $('live').hidden=false;
 $('live').addEventListener('click',()=>syncLive(true));
 syncLive();setInterval(syncLive,20000);
}else{
 $('sources').textContent='启动采样服务可获取新热点。此文件可离线导入已查证样本。';
}
render();
</script></body></html>
