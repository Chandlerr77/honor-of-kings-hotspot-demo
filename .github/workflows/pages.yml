name: Sample and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *' # 10:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      apify_trends:
        description: Run one capped Apify trend sample
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-sampling
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .data/apify-hotspots.sqlite3
          key: apify-hotspots-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apify-hotspots-v2-
      - name: Build Pages files
        env:
          HOTSPOT_APIFY_PILOT: ${{ github.event_name == 'schedule' || inputs.apify_trends }}
          APIFY_TOKEN: ${{ (github.event_name == 'schedule' || inputs.apify_trends) && secrets.APIFY_TOKEN || '' }}
        run: python build_pages.py
      - uses: actions/cache/save@v4
        with:
          path: .data/apify-hotspots.sqlite3
          key: apify-hotspots-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
